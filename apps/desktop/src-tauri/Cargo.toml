[package]
name = "gnirehtet-desktop"
version.workspace = true
description = "Desktop app for gnirehtet reverse tethering"
authors = ["Sangam Adhikari"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "gnirehtet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri-plugin-single-instance = "2"
auto-launch = "0.5"
gnirehtet-controller = { path = "../../../crates/gnirehtet-controller" }

[target.'cfg(target_os = "linux")'.dependencies]
# Versions used by tauri's GTK stack; only needed to detect the tray.
gio = "0.18"
libloading = "0.7"
