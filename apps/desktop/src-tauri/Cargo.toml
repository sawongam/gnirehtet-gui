[package]
name = "gnirehtet-desktop"
version = "0.1.0"
description = "Desktop app for gnirehtet reverse tethering"
authors = ["Sangam Adhikari <sangamadhikari.61@gmail.com>"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "gnirehtet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
gnirehtet-controller = { path = "../../../crates/gnirehtet-controller" }
