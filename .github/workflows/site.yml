name: Site

# Builds the landing page (apps/site), including the live demo built from
# apps/desktop, and publishes it to GitHub Pages. It runs from prod, like
# releases. Releases don't need a redeploy: the page asks the GitHub API for
# the latest release when it opens and links that release's files.
on:
  push:
    branches: [prod]
    paths:
      - apps/site/**
      - apps/desktop/src/**
      - apps/desktop/static/**
      - apps/desktop/svelte.config.js
      - Cargo.toml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            apps/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm install --frozen-lockfile
        working-directory: apps/site
      - run: pnpm check
        working-directory: apps/site
      # Served from the root of gnirehtet.sangamadhikari.com, so no BASE_PATH.
      - run: pnpm build
        working-directory: apps/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
