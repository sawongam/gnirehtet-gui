name: Release

# Every push to prod runs CI. If the app version has no release yet, it then
# builds installers for every platform into a draft release v<version>, checks
# that all of them are there, adds SHA256SUMS and publishes the release.
# Pushes that keep the same version only run CI.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare release
    needs: ci
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create draft release
        id: release
        run: |
          version=$(node scripts/release-info.mjs --notes "$RUNNER_TEMP/notes.md")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released. Bump the version to publish a new release."
            exit 0
          fi
          # Drop a draft left behind by an earlier failed run.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name="Gnirehtet GUI $tag" -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true --jq .id)
          echo "Created draft release $id for $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release-id != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain comes from rust-toolchain.toml. No build cache here, so
      # release builds never reuse artifacts produced by other branches.
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Fetch relay and client
        run: node scripts/fetch-upstream.mjs --target ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.prepare.outputs.release-id }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release-id }}
    steps:
      - name: Download installers
        working-directory: ${{ runner.temp }}
        run: |
          mkdir assets && cd assets
          gh api --paginate "$RELEASE/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
            done
          ls -l
      - name: Check every installer is present
        working-directory: ${{ runner.temp }}/assets
        run: |
          missing=0
          for pattern in '\.deb$' '\.rpm$' '\.AppImage$' '\.msi$' '-setup\.exe$' 'aarch64.*\.dmg$' '(x64|x86_64).*\.dmg$'; do
            if ! ls | grep -qE "$pattern"; then
              echo "::error::No release asset matches $pattern"
              missing=1
            fi
          done
          exit $missing
      - name: Upload SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/SHA256SUMS" \
            "https://uploads.github.com/$RELEASE/assets?name=SHA256SUMS"
      - name: Publish
        run: gh api -X PATCH "$RELEASE" -F draft=false -f make_latest=true
