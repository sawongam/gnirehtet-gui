name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like
      description: What you're trying to do and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Workarounds you use now, or how other tools handle it.
