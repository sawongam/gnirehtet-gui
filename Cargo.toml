[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/gnirehtet-adb",
  "crates/gnirehtet-relay",
  "crates/gnirehtet-cli",
  "crates/gnirehtet-controller",
]
# The desktop app never links the relay in-process: it runs the `gnirehtet`
# binary as a sidecar process (see docs/ARCHITECTURE.md).

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
