[package]
name = "gnirehtet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gnirehtet command-line tool (relay + adb client), built from the vendored v2.5.1 sources"
publish = false

[[bin]]
name = "gnirehtet"
path = "src/main.rs"

[dependencies]
gnirehtet-adb = { path = "../gnirehtet-adb" }
gnirehtet-relay = { path = "../gnirehtet-relay" }
log = "0.4"
chrono = "0.4"
ctrlc = { version = "3.0", features = ["termination"] }
